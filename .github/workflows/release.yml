name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (örn. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $clean = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$clean" >> $env:GITHUB_OUTPUT

      - name: Restore & Test
        run: |
          dotnet restore
          dotnet test -c Release --no-restore --verbosity normal

      - name: Publish single-file EXE (Standalone - .NET dahil)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          dotnet publish src/AcerKontrol/AcerKontrol.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false `
            -p:Version=$ver `
            -o release-out/standalone
          Copy-Item LICENSE, README.md release-out/standalone/
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item release-out/standalone/AcerKontrol.exe "release-assets/AcerKontrol-$tag-win-x64.exe"
          Compress-Archive -Path release-out/standalone/* -DestinationPath "release-assets/AcerKontrol-$tag-win-x64-standalone.zip" -Force

      - name: Publish single-file EXE (Portable - .NET 9 kurulu sistemler için)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          dotnet publish src/AcerKontrol/AcerKontrol.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false `
            -p:Version=$ver `
            -o release-out/portable
          Copy-Item LICENSE, README.md release-out/portable/
          Compress-Archive -Path release-out/portable/* -DestinationPath "release-assets/AcerKontrol-$tag-win-x64-portable.zip" -Force

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8NoBOM release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Acer Kontrol ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
